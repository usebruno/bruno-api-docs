name: CI

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'release/**']



permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint_unit_tests_and_builds:
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    steps:
      # eslint-plugin-diff needs the base branch present to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:run -w packages/bruno-api-docs

      # `draft` is null on push events, so that arm is required.
      - name: Build
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        run: npm run build -w packages/bruno-api-docs

      - name: Build standalone
        if: github.event_name == 'push' || github.event.pull_request.draft == false
        run: npm run build:standalone -w packages/bruno-api-docs

  e2e:
    needs: [changes, lint_unit_tests_and_builds]
    if: needs.changes.outputs.renderer == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bruno-api-docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        working-directory: .

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/bruno-api-docs/playwright-report/
          retention-days: 30

  changes:
    runs-on: ubuntu-latest
    outputs:
      renderer: ${{ steps.filter.outputs.renderer }}
      integrations: ${{ steps.filter.outputs.integrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            renderer:
              - '!integrations/**'
            integrations:
              - 'integrations/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/integrations-matrix.yml'

  integrations:
    needs: changes
    # a job-level if, not a workflow paths filter: a skipped job still reports and satisfies the required check
    if: needs.changes.outputs.integrations == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          working_directory: integrations

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-integrations-${{ hashFiles('integrations/package-lock.json') }}
          restore-keys: npm-integrations-

      - run: npm ci

      - run: npm run test:ci
        env:
          FORCE_COLOR: 1
          JUNIT_DIR: results

      # every assertion in the Checks tab, failures as annotations
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: integrations
          path: integrations/results/*.xml
          reporter: java-junit
          fail-on-error: false

      # depends on the live CDN bundle, which this repo does not control, so it cannot block a merge
      - name: browser contract, against the CDN
        continue-on-error: true
        run: npx playwright install --with-deps chromium && npm run test:browser
